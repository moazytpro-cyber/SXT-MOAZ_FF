

name: Build SXT Tournament APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q SXT-MOAZ_FF_Android_Project_with_Entry_Payment.zip -d project
          ls -la project

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SXT-MOAZ-FF-APK
          path: project/app/build/outputs/apk/debug/*.apk
